<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 600px; height: 315px; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #ffffff; color: #0a0a0a;
    position: relative;
  }
  /* faint ruled-paper texture, echoing the site hero */
  body::before {
    content: '';
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(180deg,
      transparent 0, transparent 21px,
      rgba(10,10,10,0.05) 21px, rgba(10,10,10,0.05) 22px);
    -webkit-mask-image: radial-gradient(ellipse 80% 90% at 88% 10%, #000 0%, transparent 70%);
            mask-image: radial-gradient(ellipse 80% 90% at 88% 10%, #000 0%, transparent 70%);
  }
  .inner { position: relative; padding: 44px 48px; }
  .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 34px; }
  .brand svg { height: 30px; width: auto; }
  .brand span { font-size: 25px; font-weight: 600; letter-spacing: -0.5px; }
  h1 {
    font-size: 36px; font-weight: 700; letter-spacing: -1px; line-height: 1.14;
    margin-bottom: 22px; max-width: 520px;
  }
  .chips {
    font-family: Consolas, 'Courier New', monospace;
    font-size: 15.5px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 36px;
  }
  .chips .plain { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 400; color: #2a2a2a; }
  .add { color: #1a7a3e; background: rgba(26,122,62,0.12); padding: 1px 7px; border-radius: 4px; }
  .del { color: #c0392b; background: rgba(192,57,43,0.07); padding: 1px 7px; border-radius: 4px; opacity: .75; position: relative; }
  .del::after { content:''; position: absolute; left: 6px; right: 6px; top: 50%; height: 1.5px; background: currentColor; }
  .foot {
    position: absolute; left: 48px; bottom: 36px;
    display: flex; gap: 22px; align-items: center;
    font-size: 13.5px; color: #6a6a6a;
  }
  .pill {
    border: 1px solid #d9d9d9; border-radius: 999px;
    padding: 4px 13px;
    font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: #555;
  }
</style>
</head>
<body>
  <div class="inner">
    <div class="brand">
      <svg viewBox="0 0 22 18" xmlns="http://www.w3.org/2000/svg" fill="#0a0a0a"><rect x="1" y="0" width="2.4" height="18"/><rect x="1" y="0" width="6" height="2.4"/><rect x="1" y="15.6" width="6" height="2.4"/><rect x="18.6" y="0" width="2.4" height="18"/><rect x="15" y="0" width="6" height="2.4"/><rect x="15" y="15.6" width="6" height="2.4"/><rect x="10" y="5" width="2" height="6"/><rect x="7" y="13" width="8" height="2"/></svg>
      <span>SpecStage</span>
    </div>
    <h1>Tailoring UFGS specifications, powered by AI.</h1>
    <div class="chips">
      <span class="plain">From master files to project-ready specs in</span>
      <span class="add">hours</span>
      <span class="del">[weeks]</span>
    </div>
    <div class="foot">
      <span class="pill">In private beta</span>
      <span>specstage.com</span>
    </div>
  </div>
</body>
</html>
